# Values for the official Datadog Helm chart (datadog/datadog).
# Each student installs this against their OWN Datadog account -- nothing
# here contains a real API key. See docs/student-guide.md for the exact
# `kubectl create secret` + `helm install` commands.

datadog:
  # Orchestrator Explorer requires a non-empty cluster name. The Agent may not
  # auto-detect it on EKS, and without it Kubernetes Explorer shows no pods or
  # workloads even though the Agent and Cluster Agent are healthy.
  clusterName: sre-lab

  # Global static tags, attached to every metric, event and service check the
  # Agent and Cluster Agent emit. Pod-level telemetry already gets env/service/
  # version from the tags.datadoghq.com/* pod labels (unified service tagging),
  # but CLUSTER-level data -- kube-state-metrics, Kubernetes events -- is
  # generated from the API server and never sees those labels. Without this,
  # a query like kubernetes_state.deployment.replicas_unavailable{env:lab}
  # returns no data and any monitor built on it silently never fires.
  tags:
    - "env:lab"

  apiKeyExistingSecret: datadog-secret # key: api-key, created by the student
  site: CHANGE_ME.datadoghq.com # required -- set to your trial org's site (see Organization Settings > API Keys in Datadog, or the "app.<site>" part of the URL once logged in)

  # APM / tracing
  apm:
    portEnabled: true
    socketEnabled: true

  # Log collection from every pod in the cluster
  logs:
    enabled: true
    containerCollectAll: true

  # Kubernetes event collection from the API server. The chart already
  # defaults this to true -- it's pinned here because it's what puts
  # "Readiness probe failed", "OOMKilled", "BackOff" and "FailedScheduling"
  # in front of you in Datadog (Events, and the Kubernetes overview) instead
  # of only in `kubectl describe pod`. Several incident scenarios in
  # docs/incident-scenarios/ depend on being able to see the event before
  # you open a terminal.
  collectEvents: true

  # Infra + container metrics
  processAgent:
    enabled: true
  containerImage:
    tag: "7"

  kubelet:
    tlsVerify: true

clusterAgent:
  enabled: true
  metricsProvider:
    enabled: true # required for the Datadog-backed HPA custom metrics, optional stretch goal

agents:
  containers:
    agent:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 300m
          memory: 512Mi
